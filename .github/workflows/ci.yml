name: ci

on:
  push:
    branches: [main]
    # Docs-only changes skip CI, except the pages the repository tests read and the icon the package packs. A later
    # pattern overrides an earlier one
    paths: &code
      - '**'
      - '!docs/**'
      - '!*.md'
      - 'docs/contributing/decisions.md'
      - 'docs/guide/diagnostics.md'
      - 'docs/public/brand/icon-128.png'
  pull_request:
    paths: *code
  # The release workflow runs these steps on the tagged commit and publishes the packages they pack
  workflow_call:
    inputs:
      upload-packages:
        description: Upload the packed packages as the artifact 'packages'
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its running check; every commit on main keeps its own. A group per branch
# would not: it holds one waiting run, and a third push replaces it even without cancel-in-progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The build and the tests where the file system ignores case and Windows shares files its own way. Windows checks
  # out with the runner's core.autocrlf, which .gitattributes overrides. The other steps stay on Linux, in build
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # MinVer reads the version from the tags
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - run: dotnet build Typeshift.slnx -c Release -warnaserror
      - run: dotnet test --solution Typeshift.slnx -c Release --no-build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet build -c Release -warnaserror

      # No gate on the number: the artifact is what a later run compares itself with
      - name: Run the tests, collecting coverage
        run: >
          dotnet test -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory artifacts/coverage

      # dotnet test merges the files of the two test projects into one
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: artifacts/coverage/merged/*.cobertura.xml
          if-no-files-found: error

      # A test that depends on the order of concurrent work fails only in some runs. No pull request waits for these
      - name: Run the tests two more times, on main and for a release
        if: github.event_name != 'pull_request'
        run: |
          dotnet test -c Release --no-build
          dotnet test -c Release --no-build

      # The runner's culture is the invariant one, which hides a number that follows the machine's culture into
      # generated code or stored JSON. Danish has the decimal comma and is among the cultures that compare text
      # their own way
      - name: Run the tests once more under a culture with a decimal comma
        run: |
          dotnet test --project tests/Typeshift.Generators.Tests -c Release --no-build -- -culture da-DK
          dotnet test --project tests/Typeshift.Tests -c Release --no-build -- -culture da-DK

      - run: dotnet slopwatch analyze --fail-on warning

      # TreatWarningsAsErrors turns every IL2xxx and IL3xxx warning into an error that fails the publish
      - name: Publish the sample as Native AOT, failing on any trim or AOT warning
        run: dotnet publish samples/Typeshift.Samples.Console -c Release -r linux-x64 -o artifacts/sample

      - name: Run the AOT sample
        run: ./artifacts/sample/Typeshift.Samples.Console

      # D45: an app published trimmed has JSON reflection off as well, without the AOT compiler to say so
      - name: Publish the sample trimmed and not as Native AOT, and run it
        run: |
          dotnet publish samples/Typeshift.Samples.Console -c Release -r linux-x64 -p:TrimmedOnly=true -o artifacts/sample-trimmed
          ./artifacts/sample-trimmed/Typeshift.Samples.Console

      - name: Run every scenario the documentation shows
        run: dotnet run --project samples/Typeshift.Samples.Docs -c Release --no-build

      - name: Pack
        run: dotnet pack src/Typeshift -c Release --no-build -o artifacts/packages

      # D61: NuGet takes a build file outside a framework folder as an asset for every framework, and a project on
      # .NET 10 then restores the package and fails in the compiler
      - name: Check that the package's build files sit under a framework folder
        shell: bash
        run: |
          files=$(unzip -Z1 artifacts/packages/Typeshift.*.nupkg)
          if grep -E '^build(Transitive)?/[^/]+$' <<< "$files"; then
            echo "::error::These build files are packed outside a framework folder"
            exit 1
          fi

      - name: Build and run a consumer of the package, not of the projects
        run: dotnet run --project samples/Typeshift.Samples.PackageConsumer -c Release

      # D68: the consumer never chose XML docs, so the package keeps its XML file in obj
      - name: Publish the consumer and run it, failing when its XML docs are published
        shell: bash
        run: |
          dotnet publish samples/Typeshift.Samples.PackageConsumer -c Release -o artifacts/consumer
          dotnet artifacts/consumer/Typeshift.Samples.PackageConsumer.dll
          if ls artifacts/consumer/*.xml 2> /dev/null; then
            echo "::error::The package published the XML docs of a project that never chose them"
            exit 1
          fi

      # D68: a project that turns XML docs on itself keeps CS1591, here for the consumer's undocumented Visitor.
      # The compiler's inputs are the same as in the build before, so only --no-incremental compiles again
      - name: Build the consumer with XML docs of its own choice, expecting CS1591
        shell: bash
        run: |
          if dotnet build samples/Typeshift.Samples.PackageConsumer -c Release --no-incremental -p:ChooseDocs=true > artifacts/chose-docs.log; then
            echo "::error::The package hid CS1591 in a project that chose XML docs itself"
            exit 1
          fi
          if ! grep -q "error CS1591.*'Visitor'" artifacts/chose-docs.log; then
            cat artifacts/chose-docs.log
            exit 1
          fi

      - if: inputs.upload-packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/packages/*
