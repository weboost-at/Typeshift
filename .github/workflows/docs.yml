name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pages' "last updated" comes from the history
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: dotnet tool restore

      - name: Fail when a snippet in the Markdown differs from its source
        run: |
          dotnet mdsnippets
          git diff --exit-code

      - run: npm ci

      - name: Fail when a page breaks the Markdown or the docs rules
        run: npm run docs:lint

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the site, failing on dead links
        run: npm run docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
