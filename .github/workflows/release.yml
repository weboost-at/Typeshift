name: release

# A version tag (v1.2.3, v0.2.0-alpha.1) builds, tests and packs that commit, then publishes the package to nuget.org
# and creates the GitHub release. Run it by hand to get the packages as an artifact without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the version from the tags
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - run: dotnet tool restore
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build

      - name: Pack, validating the package against its rules
        run: dotnet pack src/Agentic -c Release --no-build -o artifacts/packages

      - name: Build and run a consumer of the package
        run: dotnet run --project samples/Agentic.Samples.PackageConsumer -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    # Protection rules on this environment (required reviewers, say) gate every publish
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      # Trusted publishing: nuget.org trusts this workflow and hands out a key valid for one hour
      - id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the package and its symbols
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" artifacts/packages/*
          --repo "${{ github.repository }}"
          --title "$TAG"
          --generate-notes
          $([[ "$TAG" == *-* ]] && echo --prerelease)
