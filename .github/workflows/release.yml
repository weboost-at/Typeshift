name: release

# A version tag (v1.2.3, v0.2.0-alpha.1) runs everything CI runs on that commit, then publishes the package to
# nuget.org and creates the GitHub release. Run it by hand to get the packages as an artifact without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # nuget.org never deletes a version, so a tag publishes only what main and the changelog agree on
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The check against main needs its history
          fetch-depth: 0

      - name: Check that the tag sits on main and has its section in the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          if ! grep -qF "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      upload-packages: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules on this environment (required reviewers, say) gate every publish
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      # Only CHANGELOG.md, for the release's notes: global.json would pin an SDK this job does not install
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: /CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts/packages

      # MinVer reads v1.2.3 with an optional -prerelease only: v0.2 or vNext would pack the version of the tag before
      - name: Check that the package has the tag's version
        run: |
          if ! test -f "artifacts/packages/Typeshift.${GITHUB_REF_NAME#v}.nupkg"; then
            echo "::error::MinVer packed another version than $GITHUB_REF_NAME"
            ls artifacts/packages
            exit 1
          fi

      # Trusted publishing: nuget.org trusts this workflow and hands out a key valid for one hour
      - id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the package and its symbols
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release, with the tag's section of the changelog as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found' CHANGELOG.md > artifacts/notes.md
          gh release create "$TAG" artifacts/packages/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file artifacts/notes.md \
            $([[ "$TAG" == *-* ]] && echo --prerelease)
